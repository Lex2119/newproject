<ion-content [fullscreen]="true" class="mainbackground">
  <div class="TopSession">
    
    <div class="custom-header">
      <div class="back-icon-container" routerLink="/home-page">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </div>
      <span class="header-title">My Profile</span>
      <div class="header-spacer"></div> 
    </div>

    <div class="scrollable-list">
      
      <div class="profile-hero-card">
        <div class="avatar-wrapper">
          <img [src]="UserProfile.avatar || 'https://placehold.co/150?text=User'" alt="User Profile Picture">
          
          <div class="camera-badge" (click)="changeProfilePhoto()">
            <ion-icon name="camera"></ion-icon>
          </div>
        </div>
        <h1 class="user-fullname">{{ UserProfile.name }}</h1>
        <p class="user-meta-sub">{{ UserProfile.email }}</p>
      </div>

      <div class="settings-menu-group">
        
        <div class="menu-item-row" (click)="LinkToOrderHistory()">
          <div class="left-icon-box orders-accent">
            <ion-icon name="receipt-outline"></ion-icon>
          </div>
          <div class="menu-label-block">
            <span class="menu-main-title">Order History</span>
            <span class="menu-subtitle">View past orders and receipts</span>
          </div>
          <ion-icon name="chevron-forward-outline" class="row-chevron"></ion-icon>
        </div>

        <div class="menu-item-row" (click)="LinkToCart()">
          <div class="left-icon-box cart-accent">
            <ion-icon name="cart-outline"></ion-icon>
          </div>
          <div class="menu-label-block">
            <span class="menu-main-title">My Cart Basket</span>
            <span class="menu-subtitle">Check pending food choices</span>
          </div>
          <ion-icon name="chevron-forward-outline" class="row-chevron"></ion-icon>
        </div>

        <div class="menu-item-row">
          <div class="left-icon-box location-accent">
            <ion-icon name="location-outline"></ion-icon>
          </div>
          <div class="menu-label-block">
            <span class="menu-main-title">Delivery Address</span>
            <span class="menu-subtitle">{{ UserProfile.deliveryAddress }}</span>
          </div>
          <ion-icon name="chevron-forward-outline" class="row-chevron"></ion-icon>
        </div>

        <div class="menu-item-row">
          <div class="left-icon-box phone-accent">
            <ion-icon name="call-outline"></ion-icon>
          </div>
          <div class="menu-label-block">
            <span class="menu-main-title">Contact Number</span>
            <span class="menu-subtitle">{{ UserProfile.phone }}</span>
          </div>
          <ion-icon name="chevron-forward-outline" class="row-chevron"></ion-icon>
        </div>

        <div class="menu-item-row" (click)="Logout()">
          <div class="left-icon-box logout-accent">
            <ion-icon name="log-out-outline"></ion-icon>
          </div>
          <div class="menu-label-block">
            <span class="menu-main-title logout-text-color">Logout</span>
          </div>
          <ion-icon name="chevron-forward-outline" class="row-chevron"></ion-icon>
        </div>

      </div>

    </div>
  </div>
</ion-content>

<ion-footer class="persistent-footer">
  <div class="custom-tab-row">
    
    <button class="custom-tab-btn " (click)="LinkToHome()">
      <ion-icon name="home"></ion-icon>
      <span>Home</span>
    </button>

    <button class="custom-tab-btn" (click)="LinkToShop()">
      <ion-icon name="storefront-outline"></ion-icon>
      <span>Shop</span>
    </button>

    <button class="custom-tab-btn" (click)="LinkToOrderHistory()">
      <ion-icon name="receipt-outline"></ion-icon>
      <span>Orders</span>
    </button>

    <button class="custom-tab-btn" (click)="LinkToCart()">
      <ion-icon name="cart-outline"></ion-icon>
      <span>Cart</span>
    </button>

    <button class="custom-tab-btn active" (click)="LinkToProfile()">
      <ion-icon name="person-outline"></ion-icon>
      <span>Profile</span>
    </button>

  </div>
</ion-footer>
