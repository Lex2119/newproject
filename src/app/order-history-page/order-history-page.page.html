<ion-content [fullscreen]="true">
  <div class="HistoryContainer">
    
    <ion-row class="CartItemRow" *ngFor="let item of OrderHistory">

      <ion-col size="4" class="LeftCol">
        <div class="ProductContainer" [style.background-color]="item.backgroundColor">
          <div class="CartImageCircle">
            <img class="CartImg" [src]="item.image" alt="Product Image">
          </div>
        </div>
      </ion-col>

      <ion-col size="8" class="RightCol">
        <div class="details-wrapper">
          <h1 class="productName">
            {{ item.productName }}
          </h1>
          
          <h2 class="productPrice">
            Quantity: <strong>{{ item.quantity }}</strong>
          </h2>
          
          <h3 class="paymentTime">
            <ion-icon name="time-outline"></ion-icon> {{ item.paymentTime }}
          </h3>
        </div>
      </ion-col>

    </ion-row>

  </div>
</ion-content>

<ion-footer [translucent]="true" class="persistent-footer">
  <ion-toolbar class="footer-toolbar">
    <ion-tabs>
      <ion-tab-bar slot="bottom" class="custom-tab-bar">
        <ion-tab-button (click)="LinkToHome()">
          <ion-icon name="home-outline"></ion-icon>
          <ion-label>Home</ion-label>
        </ion-tab-button>

        <ion-tab-button (click)="LinkToShop()">
          <ion-icon name="storefront-outline"></ion-icon>
          <ion-label>Shop</ion-label>
        </ion-tab-button>

        <ion-tab-button (click)="LinkToOrderHistory()">
          <ion-icon name="receipt" class="active-tab-override"></ion-icon>
          <ion-label>Orders</ion-label>
        </ion-tab-button>

        <ion-tab-button (click)="LinkToCart()">
          <ion-icon name="cart-outline"></ion-icon>
          <ion-label>Cart</ion-label>
        </ion-tab-button>

        <ion-tab-button (click)="LinkToProfile()">
          <ion-icon name="person-outline"></ion-icon>
          <ion-label>Profile</ion-label>
        </ion-tab-button>
      </ion-tab-bar>
    </ion-tabs>
  </ion-toolbar>
</ion-footer>
