

<ion-content [fullscreen]="true">

 <ion-grid class="theGrid">

  <div class="topRow">
    <ion-row *ng="let pair of myproductlist">
        <ion-col class="box menu-box"></ion-col>        
        <ion-col class="box menu-box" size="3"></ion-col>
      </ion-row>
      <ion-row class="image-box ">
        <ion-col class="box">
          <img class="productImg" src="/assets/mexican-food-platter-with-tacos-grilled-chicken_84443-79098-removebg-preview.png">
        </ion-col>
      </ion-row>
      
      <ion-row class="text-box">
        <ion-col class="box">
          <div>
            <h1>$120</h1>
            <h2>Food</h2>
          </div>
        </ion-col>
      </ion-row>
  </div>

  <div class="midRow">
    
  </div>

  <div class="spacer"></div>

  <div class="bottomSession">
    <ion-row class="bottomRow">
      <ion-col size="6"></ion-col>

      <ion-col size="6" class="rightCol">
        <div class="GreenAdd">
          Add to Cart
        </div>
      </ion-col>

    </ion-row>
  </div>

 </ion-grid>

</ion-content>
