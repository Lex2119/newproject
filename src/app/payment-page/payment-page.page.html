<ion-content [fullscreen]="true" class="paymentBackground">

  <div class="paymentContainer">

    <div class="topSection">
      <h1 class="paymentTitle">Payment</h1>
      <p class="secureSubtitle">
        <ion-icon name="lock-closed-outline"></ion-icon> Secure SSL Encrypted Checkout
      </p>
    </div>

    <div class="summaryCard">
      <div class="summaryRow">
        <span class="label">Order Summary</span>
        <span class="value">
          {{ CartList?.length || 0 }} {{ CartList?.length === 1 ? 'item' : 'items' }}
        </span>
      </div>
      <div class="summaryRow totalRow">
        <span class="label">Total Amount</span>
        <span class="totalPrice">RM {{ GetTotalPrice() | number:'1.2-2' }}</span>
      </div>
    </div>

    <div class="paymentFormContainer">
      <h2 class="sectionTitle">Card Information</h2>
      
      <div class="inputWrapper">
        <label class="inputLabel">Cardholder Name</label>
        <input
          type="text"
          placeholder="Lim"
          class="stripeInput"
          [(ngModel)]="cardName"
        >
      </div>

      <div class="inputWrapper">
        <label class="inputLabel">Card Number</label>
        <div class="innerInputIcon">
          <input
            type="text"
            placeholder="4242 4242 4242 4242"
            class="stripeInput withIcon"
            maxlength="19"
            [(ngModel)]="cardNumber"
          >
          <ion-icon name="card-outline" class="cardIcon"></ion-icon>
        </div>
      </div>

      <div class="rowInput">
        <div class="inputWrapper flex-1">
          <label class="inputLabel">Expiration Date</label>
          <input
            type="text"
            placeholder="MM / YY"
            class="stripeInput"
            maxlength="5"
            [(ngModel)]="expiry"
          >
        </div>

        <div class="inputWrapper flex-1">
          <label class="inputLabel">CVC</label>
          <input
            type="password"
            placeholder="123"
            class="stripeInput"
            maxlength="4"
            [(ngModel)]="cvv"
          >
        </div>
      </div>
    </div>

    <div class="actionButtonGroup">
      
      <button 
        class="stripePayButton" 
        [disabled]="isLoading || !CartList || CartList.length === 0 || !cardName.trim() || !cardNumber.trim() || !expiry.trim() || !cvv.trim()" 
        (click)="PayNow()"
      >
        <span *ngIf="!isLoading">
          Pay RM {{ GetTotalPrice() | number:'1.2-2' }}
        </span>
        <div *ngIf="isLoading" class="spinnerWrapper">
          <ion-spinner name="crescent"></ion-spinner>
          <span>Processing...</span>
        </div>
      </button>

      <button 
        class="stripeCancelButton" 
        [disabled]="isLoading"
        (click)="CancelPayment()"
      >
        Cancel Order
      </button>

    </div>

    <div class="stripeFooter">
      <p class="stripeText">
        <ion-icon name="shield-checkmark-outline"></ion-icon> Powered by Stripe
      </p>
    </div>

  </div>

</ion-content>
