<ion-content [fullscreen]="true" class="mainbackground">
  <div class="cart-flex-layout">
    
    <div class="custom-header">
      <div class="back-icon-container" routerLink="/home-page">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </div>
      <span class="header-title">Cart</span>
      <div class="header-spacer"></div> 
    </div>

    <div class="scrollable-list">
      <ion-grid>
        <div *ngIf="CartList.length <= 0" class="emptyCart">
          Your cart is empty
        </div>
        
        <ion-row class="CartItemRow" *ngFor="let item of CartList">
          <ion-col size="5.5" class="LeftCol">
            <div class="ProductContainer" [style.background-color]="item.backgroundColor">
              <div class="CartImageCircle">
                <img class="CartImg" [src]="item.image" alt="Product Image">
              </div>
            </div>
            
            <div class="quantityarea">
              <div class="qty-action" (click)="decreaseQty(item)">−</div>
              <div class="Divider"></div>
              <div class="quantitytext">{{item.quantity}}</div>
              <div class="Divider"></div>
              <div class="qty-action" (click)="increaseQty(item)">+</div>
            </div>
          </ion-col>
          
          <ion-col size="6.5" class="RightCol">
            <div class="details-wrapper">
              <h1 class="productName">{{item.productName}}</h1>
              <h2 class="productPrice">RM{{item.Price * item.quantity}}</h2>
            </div>
          </ion-col>
        </ion-row>
      </ion-grid>
    </div>

    <div class="BottomSession">
      <div class="PriceSummaryBlock">
        <span class="total-label">Total Payment</span>
        <span class="checkout-price">RM{{GetTotalPrice()}}</span>
      </div>

      <div class="CheckoutBox" [class.disabledButton]="!CanCheckout()" (click)="Checkout()">
        <div class="checkout-text">Checkout</div>
      </div>
    </div>

  </div>
</ion-content>

<ion-footer class="persistent-footer">
  <div class="custom-tab-row">
    
    <button class="custom-tab-btn" [class.active]="currentTab === 'home'" (click)="LinkToHome()">
      <ion-icon [name]="currentTab === 'home' ? 'home' : 'home-outline'"></ion-icon>
      <span>Home</span>
    </button>

    <button class="custom-tab-btn" [class.active]="currentTab === 'shop'" (click)="LinkToShop()">
      <ion-icon [name]="currentTab === 'shop' ? 'storefront' : 'storefront-outline'"></ion-icon>
      <span>Shop</span>
    </button>

    <button class="custom-tab-btn" [class.active]="currentTab === 'orders'" (click)="LinkToOrderHistory()">
      <ion-icon [name]="currentTab === 'orders' ? 'receipt' : 'receipt-outline'"></ion-icon>
      <span>Orders</span>
    </button>

    <button class="custom-tab-btn" [class.active]="currentTab === 'cart'" (click)="LinkToCart()">
      <ion-icon [name]="currentTab === 'cart' ? 'cart' : 'cart-outline'"></ion-icon>
      <span>Cart</span>
    </button>

    <button class="custom-tab-btn" [class.active]="currentTab === 'profile'" (click)="LinkToProfile()">
      <ion-icon [name]="currentTab === 'profile' ? 'person' : 'person-outline'"></ion-icon>
      <span>Profile</span>
    </button>

  </div>
</ion-footer>
