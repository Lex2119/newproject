
<ion-content [fullscreen]="true" class="mainbackground">

 <div class="TopSession">

  <div class="scollable-list">
    <ion-grid>
      <ion-row class="CartItemRow" *ngFor="let item of testlist" >
        <ion-col size="6" class="LeftCol">
          <div class="LeftCol" style="width: 100%;" >

            <div class="ProductContainer"></div>
            <img class="CartImg" src="/assets/mexican-food-platter-with-tacos-grilled-chicken_84443-79098-removebg-preview.png">
            <ion-card class="quantityarea">
              <ion-grid>
                <ion-row>
                  <ion-col size="3" >-</ion-col>

                  <ion-col size="auto">
                    <div class="Divider"></div>
                  </ion-col>

                  <ion-col size="4">1</ion-col>

                  <ion-col size="auto">
                    <div class="Divider"></div>
                  </ion-col>

                  <ion-col size="3">+</ion-col>
                </ion-row>
              </ion-grid>
            </ion-card>
          </div>
        </ion-col>
        <ion-col size="6"></ion-col>
      </ion-row>
    </ion-grid>

  </div>

 </div>

</ion-content>
